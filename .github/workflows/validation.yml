name: Validate portal
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:run
      - run: bun run build
  database-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: portal_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Check client fields in disposable PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-only-password
          PGDATABASE: portal_security_test
        run: psql -X --set ON_ERROR_STOP=on --file tests/sql/client-administrative-fields.sql
      - name: Check atomic file replacement in disposable PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-only-password
          PGDATABASE: portal_security_test
        run: |
          psql -X --set ON_ERROR_STOP=on --file tests/sql/atomic-document-replacement.sql
          python3 tests/sql/atomic-document-concurrency.py
          psql -X --set ON_ERROR_STOP=on --file tests/sql/atomic-certificate-publication.sql
          psql -X --set ON_ERROR_STOP=on --file tests/sql/admin-access-management.sql
          python3 tests/sql/admin-access-concurrency.py
      - name: Check real has_role and atomic operations in a separate disposable database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-only-password
        run: |
          createdb portal_real_roles_test
          psql -X --set ON_ERROR_STOP=on -d portal_real_roles_test --file tests/sql/real-roles-and-atomic-operations.sql
